<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#c8efd9">
<title>ぽかぽか つりの森</title>
<style>
:root{--ink:#35584d;--cream:#fff9e8;--mint:#c8efd9;--green:#3d826d;--pink:#f4a6a0;--gold:#f5ce67}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:#e2f5d8;color:var(--ink);font-family:system-ui,-apple-system,sans-serif;display:flex;justify-content:center;align-items:center;user-select:none;-webkit-user-select:none}
.app{width:min(100%,450px);padding:10px;display:flex;flex-direction:column;gap:8px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:18px;line-height:1.2;margin:0;font-weight:900;color:#32675b}
.subtitle{font-size:11px;color:#668a79;margin-top:2px}
.stats{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.pill{background:var(--cream);border:2px solid #c8e2bf;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:850;white-space:nowrap;box-shadow:0 2px 0 #a9d0ae}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tab{padding:8px 4px;border:2px solid #b5d9bd;border-radius:12px;background:#f7ffe9;color:#4e7868;font-size:12px;font-weight:850;box-shadow:0 3px 0 #b3d2b4}
.tab.active{background:#397f70;color:#fff8df;border-color:#397f70;box-shadow:0 3px 0 #286153}
.panel{display:none;flex:1;gap:8px;flex-direction:column}.panel.active{display:flex}
.scene{width:100%;border:4px solid #fff8df;border-radius:15px;overflow:hidden;background:#a8d887;box-shadow:0 4px 0 #b6d9b0,0 0 0 2px #b4d8bd;display:flex;justify-content:center}
canvas{display:block;image-rendering:pixelated;touch-action:none}
.message{min-height:40px;padding:8px 10px;border:2px solid #c4e1bd;border-radius:13px;background:var(--cream);font-size:12px;font-weight:650;line-height:1.4}
#message{height:120px;min-height:120px;flex:0 0 120px;overflow-y:auto}
#message .catch-entry{display:block;min-height:2.9em}
.controls{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center}
.pad{display:grid;grid-template-columns:repeat(3,40px);grid-template-rows:repeat(2,38px);gap:3px;justify-content:center}
button{font:inherit;color:var(--ink);background:var(--cream);border:2px solid #b7d8b8;border-radius:12px;box-shadow:0 3px 0 #a6caa9;touch-action:manipulation;user-select:none;cursor:pointer}
button:active,button.pressed{transform:translateY(2px);box-shadow:0 1px 0 #a6caa9}
.dir{font-size:16px;font-weight:900;background:#eaf7d8}.empty{visibility:hidden}
.actions{display:flex;flex-direction:column;gap:6px;height:100%}.action{flex:1;min-height:80px;font-weight:850;font-size:11px;padding:4px;display:flex;align-items:center;justify-content:center;text-align:center}
.fishBtn{background:#f6c968;border-color:#e4b34e;box-shadow:0 3px 0 #c9963e}
#bookGrid,.rodGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.booktop,.shopTop{display:flex;justify-content:space-between;align-items:center;background:var(--cream);border:2px solid #c4e1bd;border-radius:13px;padding:8px 10px;font-weight:850;font-size:12px}
.fishcard,.rodcard{background:var(--cream);border:2px solid #c4e1bd;border-radius:14px;padding:8px;display:flex;gap:8px;align-items:center;box-shadow:0 3px 0 #c4dfbd;min-width:0}
.fishicon{width:44px;height:44px;flex:0 0 44px;border-radius:10px;background:#e3f4e4;display:flex;align-items:center;justify-content:center;font-size:24px}
.fishname,.rodname{font-weight:900;font-size:12px}.fishdesc,.roddesc{font-size:10px;color:#6e8c7d;margin-top:2px;line-height:1.3}
.unknown{filter:grayscale(1);opacity:.5}
.rarity{font-size:9px;font-weight:900;margin-top:2px}
.new-label{color:#e32636;font-weight:1000;font-size:1em;margin-right:2px}
.rodcard{align-items:flex-start}.rodicon{font-size:22px;flex:0 0 25px}
.rodmain{min-width:0;flex:1}.rodprice{font-size:11px;font-weight:900;margin-top:4px}
.rodcard button{font-size:10px;padding:5px 6px;align-self:center;box-shadow:0 2px 0 #a6caa9}
.rodcard button:disabled{opacity:.5}
.bar{height:4px;background:#dbe9d7;border-radius:999px;overflow:hidden;margin-top:4px}.bar span{display:block;height:100%;background:#e7b84f}
.smallnote{text-align:center;font-size:11px;color:#628477}
.saveManageButton{padding:8px 12px;font-size:12px;font-weight:850;white-space:nowrap}
.savePanel{border:2px solid #c4e1bd;border-radius:14px;background:var(--cream);padding:12px;display:flex;flex-direction:column;gap:10px}
.saveActions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.saveActions button{padding:12px 6px;font-size:13px;font-weight:850}
.saveHint{font-size:12px;line-height:1.6;color:#628477}
#saveMessage{font-size:12px;line-height:1.5;min-height:20px;white-space:pre-wrap}
#saveImport{display:none}
</style>
</head>
<body>
<main class="app">
<header>
 <div><h1>🌷 ぽかぽか つりの森</h1><div class="subtitle">うさぎさんと、のんびり釣り暮らし。</div></div><button class="saveManageButton" id="openSaveManage" type="button">⚙️ セーブ管理</button>
</header>
<section class="panel active" id="gamePage">
 <div class="scene"><canvas id="game" width="416" height="260"></canvas></div>
 <div class="message" id="message">池のまわりや桟橋で釣りをしよう。</div>
 <nav class="tabs">
  <button class="tab active" data-page="game">🌳 つり場</button>
  <button class="tab" data-page="book">📖 さかな図鑑</button>
  <button class="tab" data-page="shop">🛍️ 釣具屋</button>
 </nav>
 <div class="stats"><span class="pill">🪙 <b id="coins">0</b> G</span><span class="pill">🐟 <b id="fishCount">0</b> 匹</span></div>
 <section class="controls">
  <div class="actions"><button class="action fishBtn" data-action="fish">🎣 つりをする</button></div>
  <div class="pad">
   <button class="empty" tabindex="-1"></button><button class="dir" data-dir="up">▲</button><button class="empty" tabindex="-1"></button>
   <button class="dir" data-dir="left">◀</button><button class="dir" data-dir="down">▼</button><button class="dir" data-dir="right">▶</button>
  </div>
  <div class="actions"><button class="action fishBtn" data-action="fish">🎣 つりをする</button></div>
 </section>
 <div class="smallnote" id="rodStatus">装備中：はじめての釣り竿</div>
</section>
<section class="panel" id="bookPage">
 <div class="booktop"><span>📖 さかな図鑑</span><span id="bookProgress">0 / 8 種</span></div>
 <div class="message">釣った魚は図鑑に記録されるよ。レアな魚を見つけよう！</div>
 <div id="bookGrid"></div>
 <button class="action" data-goto="game">🌳 つり場にもどる</button>
</section>
<section class="panel" id="shopPage">
 <div class="shopTop"><span>🛍️ うさぎの釣具屋さん</span><span>🪙 <b id="shopCoins">0</b> G</span></div>
 <div class="message">高い釣り竿ほどレアな魚が釣れやすいよ。買った竿は「装備する」を押してね。</div>
 <div class="rodGrid" id="rodGrid"></div>
 <button class="action" data-goto="game">🌳 つり場にもどる</button>
</section>
<section class="panel" id="savePage">
 <div class="booktop"><span>⚙️ セーブ管理</span></div>
 <div class="savePanel">
  <div class="saveActions"><button id="exportSave" type="button">📥 書き出す</button><button id="importSave" type="button">📤 読み込む</button></div>
  <input id="saveImport" type="file" accept=".json,application/json">
  <div class="saveHint">読み込むと、このブラウザの現在のセーブデータは上書きされます。先に「書き出す」で保存してください。</div>
  <div id="saveMessage" role="status" aria-live="polite"></div>
 </div>
 <button class="action" data-goto="game" type="button">🌳 つり場にもどる</button>
</section>
</main>
<script>
(()=>{
const $=id=>document.getElementById(id), canvas=$('game'), ctx=canvas.getContext('2d');
ctx.imageSmoothingEnabled=false;
const W=416, H=260;
let floatPos={x:208, y:130};

const fishTypes=[
{id:'carp',name:'こい',value:8,emoji:'🐟',rarity:'ふつう',base:12,desc:'池でよく見かける魚。'},
{id:'ayu',name:'あゆ',value:14,emoji:'🐠',rarity:'ふつう',base:12,desc:'きれいな水が好き。'},

{id:'eel',name:'うなぎ',value:38,emoji:'🐟',rarity:'ちょっとレア',base:1.8,desc:'細長い体ですいすい泳ぐ。'},
{id:'shrimp',name:'えび',value:18,emoji:'🦐',rarity:'ちょっとレア',base:1.1,desc:'ぴょんとはねる小さな生き物。'},
{id:'crab',name:'かに',value:32,emoji:'🦀',rarity:'ちょっとレア',base:1,desc:'横歩きが得意。'},
{id:'amago',name:'あまご',value:34,emoji:'🐠',rarity:'ちょっとレア',base:0.75,desc:'清流にすむ、斑点模様の魚。'},
{id:'goldfish',name:'きんぎょ',value:75,emoji:'🐡',rarity:'レア',base:3,desc:'あざやかな色の人気者。'},
{id:'piranha',name:'ピラニア',value:55,emoji:'🐠',rarity:'レア',base:3,desc:'鋭い歯を持つ熱帯の魚。'},
{id:'salmon',name:'さけ',value:48,emoji:'🐠',rarity:'レア',base:1.4,desc:'川をのぼる力強い魚。'},
{id:'tuna',name:'まぐろ',value:85,emoji:'🐟',rarity:'レア',base:1.3,desc:'泳ぐスピードが速い大きな魚。'},
{id:'octopus',name:'たこ',value:65,emoji:'🐙',rarity:'レア',base:1.2,desc:'八本の足で器用に動く。'},
{id:'squid',name:'いか',value:52,emoji:'🦑',rarity:'レア',base:1.2,desc:'水の中をすばやく泳ぐ。'},

{id:'rainbow',name:'にじいろフィッシュ',value:120,emoji:'🐠',rarity:'ウルトラレア',base:2,desc:'体に虹のような色が浮かぶ。'},
{id:'seahorse',name:'たつのおとしご',value:90,emoji:'🐠',rarity:'ウルトラレア',base:0.8,desc:'馬のような顔をした不思議な魚。'},
{id:'angelfish',name:'エンゼルフィッシュ',value:110,emoji:'🐠',rarity:'ウルトラレア',base:0.7,desc:'大きなひれがドレスのよう。'},
{id:'arowana',name:'アロワナ',value:180,emoji:'🐟',rarity:'ウルトラレア',base:0.6,desc:'古代から姿が変わらない魚。'},
{id:'jewel_arowana',name:'ほうせきアロワナ',value:420,emoji:'🐠',rarity:'ウルトラレア',base:0.25,desc:'宝石のようなうろこをまとう魚。'},
{id:'moonfish',name:'おつきさま魚',value:150,emoji:'🐡',rarity:'伝説',base:3,desc:'めったに出会えない幻の魚。'},
{id:'coelacanth',name:'シーラカンス',value:260,emoji:'🐟',rarity:'伝説',base:0.5,desc:'生きた化石と呼ばれる魚。'},
{id:'starlight',name:'ほしぞら魚',value:320,emoji:'🐠',rarity:'伝説',base:0.5,desc:'夜空の星のように光る幻の魚。'},
{id:'crystal',name:'クリスタルフィッシュ',value:500,emoji:'🐡',rarity:'伝説',base:0.4,desc:'透き通った体が宝石のよう。'},
{id:'phoenix',name:'ほうおう魚',value:1200,emoji:'🐠',rarity:'神話級',base:0.15,desc:'炎の羽のようなひれを持つ幻の魚。'},
{id:'unicorn',name:'ユニコーンフィッシュ',value:2500,emoji:'🦄',rarity:'神話級',base:0.10,desc:'虹色の角がきらめく奇跡の魚。'},
{id:'cosmic',name:'うちゅうの主',value:5000,emoji:'🌌',rarity:'神話級',base:0.04,desc:'星々の海から現れる究極の幻。'},
{id:'sacred_whale',name:'せいなるくじら',value:10000,emoji:'🐋',rarity:'神話級',base:0.015,desc:'伝説のさらに先にいる、神聖な巨魚。'}
];

const rods=[
{name:'はじめての釣り竿',price:0,power:0,escapeRate:0.12,desc:'まずはここから。'},
{name:'たけの釣り竿',price:60,power:1,escapeRate:0.12,desc:'しなやかで使いやすい。'},
{name:'こもれびロッド',price:140,power:2,escapeRate:0.12,desc:'ちょっとレアな魚に強い。'},
{name:'さくらロッド',price:280,power:3,escapeRate:0.12,desc:'春色のかわいい竿。'},
{name:'しおかぜロッド',price:500,power:4,escapeRate:0.12,desc:'風に負けない安定感。'},
{name:'ほしぞらロッド',price:850,power:5,escapeRate:0.12,desc:'星の力で魚を引き寄せる。'},
{name:'にじいろロッド',price:1300,power:6,escapeRate:0.12,desc:'珍しい魚を狙いやすい。'},
{name:'しんぴのロッド',price:2000,power:7,escapeRate:0.12,desc:'水面の気配を感じる。'},
{name:'おうごんロッド',price:3200,power:8,escapeRate:0.12,desc:'伝説の魚にも届く性能。'},
{name:'つきあかりロッド',price:5000,power:9,escapeRate:0.12,desc:'最高級。幻の魚を狙おう。'},
{name:'ほしのきせきロッド',price:12000,power:10,escapeRate:0.12,desc:'究極の釣り竿。神話級の魚にも届く。'},
{name:'てんくうのしんわロッド',price:20000,power:13,escapeRate:0.10,desc:'神話級を狙う最高峰の竿。魚がすこし逃げにくい。'},
{name:'まかいのロッド',price:50000,power:16,escapeRate:0.06,desc:'魔界の力を宿した竿。魚が逃げにくい。'},
{name:'てんかいのロッド',price:100000,power:20,escapeRate:0.03,desc:'天界の力を宿した竿。魚がとても逃げにくい。'}
];

const rarityColors={'ふつう':'#4f9b68','ちょっとレア':'#3986c5','レア':'#9661c9','ウルトラレア':'#e58b32','伝説':'#d34f85','神話級':'#e53935'};
const rarityOrder={'ふつう':0,'ちょっとレア':1,'レア':2,'ウルトラレア':3,'伝説':4,'神話級':5};

const defSave={coins:100,caughtCounts:{},giantCounts:{},inventory:[],ownedRods:[0],equippedRod:0,player:{x:208,y:200}};

let save=JSON.parse(localStorage.getItem('pokapokaFishingSaveV2')||JSON.stringify(defSave));
save={...defSave, ...save, caughtCounts:save.caughtCounts||{}, giantCounts:save.giantCounts||{}, inventory:save.inventory||[], ownedRods:save.ownedRods||[0]};

let mode='idle', biteTimer=null, waitTimer=null, fishingAttempts=0;
let nextFeverAt=10+Math.floor(Math.random()*11), feverCastsRemaining=0, currentCastFever=false;
const player={...save.player};
if(player.y>220) player.y=200;

const persist=()=>{save.player={x:player.x,y:player.y}; localStorage.setItem('pokapokaFishingSaveV2',JSON.stringify(save)); updateUI();};
 const saveKey='pokapokaFishingSaveV2';
 const saveFeedback=(message)=>{$('saveMessage').textContent=message;};
 $('openSaveManage').addEventListener('click',()=>{
  document.querySelectorAll('.panel').forEach(el=>el.classList.remove('active'));
  $('savePage').classList.add('active');
  saveFeedback('');
 });
 const encoder=new TextEncoder(),decoder=new TextDecoder();
 const toBase64=bytes=>{let s='';for(const b of bytes)s+=String.fromCharCode(b);return btoa(s);};
 const fromBase64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
 // ブラウザ間で共通の鍵を導出。HTML内の秘密文字列は解析可能なため、強固な不正対策ではありません。
 const embeddedSecret='pokapoka-fishing-transfer-key-v3-2026';
 async function deriveKey(salt){
  const base=await crypto.subtle.importKey('raw',encoder.encode(embeddedSecret),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
 }
 const isRecord=v=>v!==null&&typeof v==='object'&&!Array.isArray(v);
 const validCounts=v=>isRecord(v)&&Object.entries(v).every(([k,n])=>fishTypes.some(f=>f.id===k)&&Number.isSafeInteger(n)&&n>=0);
 function validateSave(incoming){
  if(!isRecord(incoming)||!Number.isSafeInteger(incoming.coins)||incoming.coins<0||
     !validCounts(incoming.caughtCounts)||!validCounts(incoming.giantCounts)||
     Object.entries(incoming.giantCounts).some(([id,n])=>n>(incoming.caughtCounts[id]||0))||
     !Array.isArray(incoming.ownedRods)||incoming.ownedRods.length===0||
     !incoming.ownedRods.every(i=>Number.isInteger(i)&&i>=0&&i<rods.length)||
     !Number.isInteger(incoming.equippedRod)||!incoming.ownedRods.includes(incoming.equippedRod)||
     !isRecord(incoming.player)||!Number.isFinite(incoming.player.x)||!Number.isFinite(incoming.player.y)||
     incoming.player.x<24||incoming.player.x>392||incoming.player.y<40||incoming.player.y>216)
   throw new Error('セーブデータの内容が正しくありません。');
 }
 $('exportSave').addEventListener('click',async()=>{
  if(!crypto?.subtle){saveFeedback('暗号化に対応していません。HTTPSで開いてください。');return;}
  try{
   save.player={x:player.x,y:player.y};
   localStorage.setItem(saveKey,JSON.stringify(save));
   const salt=crypto.getRandomValues(new Uint8Array(16));
   const iv=crypto.getRandomValues(new Uint8Array(12));
   const key=await deriveKey(salt);
   const plaintext=encoder.encode(JSON.stringify({format:'pokapoka-fishing-save',version:1,save}));
   const ciphertext=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,plaintext));
   const data={format:'pokapoka-fishing-encrypted-save',version:3,algorithm:'AES-256-GCM',kdf:'PBKDF2-SHA256',iterations:250000,salt:toBase64(salt),iv:toBase64(iv),data:toBase64(ciphertext)};
   const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
   const url=URL.createObjectURL(blob),link=document.createElement('a');
   link.href=url;link.download='pokapoka-fishing-encrypted-'+new Date().toISOString().slice(0,10)+'.json';
   document.body.appendChild(link);link.click();link.remove();
   setTimeout(()=>URL.revokeObjectURL(url),60000);
   saveFeedback('暗号化したセーブデータを書き出しました。');
  }catch(error){saveFeedback('書き出しに失敗しました：'+(error.message||'ブラウザの設定をご確認ください。'));}
 });
 $('importSave').addEventListener('click',()=>{$('saveImport').value='';$('saveImport').click();});
 $('saveImport').addEventListener('change',async(event)=>{
  const file=event.target.files?.[0];if(!file)return;
  try{
   if(!crypto?.subtle)throw new Error('HTTPSで開いてください。');
   if(file.size>2*1024*1024)throw new Error('ファイルが大きすぎます。');
   const parsed=JSON.parse(await file.text());
   if(!isRecord(parsed)||parsed.format!=='pokapoka-fishing-encrypted-save'||parsed.version!==3||
      parsed.algorithm!=='AES-256-GCM'||parsed.kdf!=='PBKDF2-SHA256'||parsed.iterations!==250000||
      !['salt','iv','data'].every(k=>typeof parsed[k]==='string'))
    throw new Error('暗号化されたセーブファイルではありません。');
   const salt=fromBase64(parsed.salt),iv=fromBase64(parsed.iv),ciphertext=fromBase64(parsed.data);
   if(salt.length!==16||iv.length!==12||ciphertext.length<16)throw new Error('暗号化データの形式が正しくありません。');
   let decrypted;
   try{
    const key=await deriveKey(salt);
    decrypted=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ciphertext);
   }catch{throw new Error('ファイルが改変・破損しているか、対応していない形式です。');}
   const payload=JSON.parse(decoder.decode(decrypted));
   if(!isRecord(payload)||payload.format!=='pokapoka-fishing-save'||payload.version!==1)
    throw new Error('復号したセーブデータの形式が正しくありません。');
   const incoming=payload.save;
   validateSave(incoming);
   if(!confirm('現在のセーブデータを上書きします。よろしいですか？\n※必要なら先に書き出してください。'))return;
   const restored={...defSave,...incoming,caughtCounts:{...incoming.caughtCounts},giantCounts:{...incoming.giantCounts},ownedRods:[...incoming.ownedRods],inventory:Array.isArray(incoming.inventory)?incoming.inventory.filter(id=>fishTypes.some(f=>f.id===id)):[]};
   localStorage.setItem(saveKey,JSON.stringify(restored));
   saveFeedback('読み込みが完了しました。ゲームを再読み込みします。');
   location.reload();
  }catch(error){saveFeedback('読み込みに失敗しました：'+(error.message||'ファイルを確認してください。'));}
 });

const say=(t,html=false)=>{const m=$('message'); m.classList.toggle('catch-log',html); m[html?'innerHTML':'textContent']=t;};
const totalCaught=()=>Object.values(save.caughtCounts).reduce((a,b)=>a+b,0);
const rodBonus=i=>rods[i].power*0.25;

function updateUI(){
 $('coins').textContent=save.coins; $('shopCoins').textContent=save.coins; $('fishCount').textContent=totalCaught();$('rodStatus').textContent=`装備中：${rods[save.equippedRod].name}（レア魚ボーナス +${Math.round(rodBonus(save.equippedRod)*100)}%）`;
 const btnText=mode==='waiting'?'🌊 アタリを待ってるよ…':mode==='bite'?'✨ 今だ！合わせる':mode==='reel'?'🎣 釣り上げ中…':'🎣 つりをする';
 document.querySelectorAll('.fishBtn').forEach(b=>{
  b.textContent=btnText;
  b.disabled=mode==='reel';
 });
 renderBook(); renderShop();
}

function renderBook(){
 const grid=$('bookGrid'); grid.innerHTML='';
 const known=fishTypes.filter(f=>(save.caughtCounts[f.id]||0)>0).length;
 $('bookProgress').textContent=`${known} / ${fishTypes.length} 種`;
 [...fishTypes].sort((a,b)=>(rarityOrder[a.rarity]??99)-(rarityOrder[b.rarity]??99)||a.value-b.value).forEach(f=>{
  const n=save.caughtCounts[f.id]||0, yes=n>0;
  const hasGiant=(save.giantCounts[f.id]||0)>0;
  const displayName = yes ? f.name + (hasGiant ? ' ★' : '') : '？？？';
  grid.innerHTML+=`<article class="fishcard"><div class="fishicon ${yes?'':'unknown'}">${yes?f.emoji:'❔'}</div><div><div class="fishname">${displayName}</div><div class="rarity" style="color:${rarityColors[f.rarity]}">${yes?f.rarity:'未発見'}</div><div class="fishdesc">${yes?`${f.desc}<br>価格：${f.value} G<br>釣った数：${n}匹 (巨大魚${save.giantCounts[f.id]||0}匹)`:'まだ出会っていない魚'}</div></div></article>`;
 });
}

function renderShop(){
 const grid=$('rodGrid'); grid.innerHTML='';
 rods.forEach((r,i)=>{
  const owned=save.ownedRods.includes(i), equipped=save.equippedRod===i, can=save.coins>=r.price;
  const stats=Math.min(100,18+r.power*5.5);
  grid.innerHTML+=`<article class="rodcard"><div class="rodicon">🎣</div><div class="rodmain"><div class="rodname">${i+1}. ${r.name}</div><div class="roddesc">${r.desc}</div><div class="bar"><span style="width:${stats}%"></span></div><div class="roddesc">レア魚ボーナス +${Math.round(rodBonus(i)*100)}%</div><div class="rodprice">${r.price?r.price+' G':'無料'}</div></div><button ${equipped?'disabled':''} data-rod="${i}">${equipped?'装備中':owned?'装備する':can?'購入する':'お金不足'}</button></article>`;
 });
 grid.querySelectorAll('[data-rod]').forEach(b=>b.onclick=()=>rodAction(+b.dataset.rod));
}

function rodAction(i){
 if(save.ownedRods.includes(i)){save.equippedRod=i; say(`${rods[i].name}を装備したよ！`); persist(); return;}
 if(save.coins<rods[i].price){say(`あと${rods[i].price-save.coins} G必要だよ！`); return;}
 save.coins-=rods[i].price; save.ownedRods.push(i); save.equippedRod=i; say(`${rods[i].name}を購入したよ！`); persist();
}

const rect=(x,y,w,h,c)=>{ctx.fillStyle=c; ctx.fillRect(Math.round(x),Math.round(y),w,h);};

function drawScene(){
 rect(0,0,W,H,'#a8d887');
 for(let y=0;y<H;y+=16)for(let x=0;x<W;x+=16){
  if((x*3+y*7)%5===0)rect(x+4,y+5,2,2,'#8bc776');
  if((x+y*2)%7===0)rect(x+10,y+10,2,2,'#c3e69a');
 }

 rect(40,24,336,18,'#c5e69b');
 rect(40,42,336,14,'#f3d99a');
 rect(40,56,336,114,'#70c8d1');
 for(let y=64;y<164;y+=16)for(let x=48;x<368;x+=24){
  rect(x,y,10,2,'#9be0dc');
 }

 rect(200, 56, 16, 114, '#c29a6b');
 rect(196, 56, 4, 114, '#a27a4b');
 rect(216, 56, 4, 114, '#a27a4b');
 for(let py = 64; py < 170; py += 16){
  rect(200, py, 16, 2, '#916739');
 }

 for(const [x,y] of [[30,8],[100,8],[180,8],[260,8],[340,8],[2,80],[2,130],[394,80],[394,130]]){
  rect(x+5,y+10,6,14,'#a56e4d');
  rect(x-2,y,20,12,'#4c9b67');
  rect(x+3,y-3,14,12,'#79bd76');
 }

 for(const [x,y] of [[35,100],[375,110],[50,200],[350,205],[180,195]]){
  rect(x,y,14,8,'#a1b5a0');
  rect(x+2,y-2,10,2,'#d3d6b4');
 }

 const x=Math.round(player.x), y=Math.round(player.y);

 rect(x-6, y+11, 12, 3, '#76b46b');

 rect(x-5, y-13, 3, 10, '#fff8ed');
 rect(x+2, y-13, 3, 10, '#fff8ed');
 rect(x-4, y-11, 1, 6, '#f4a6b2');
 rect(x+3, y-11, 1, 6, '#f4a6b2');

 rect(x-8, y-5, 16, 12, '#fff8ed');
 rect(x-9, y-3, 2, 7, '#fff8ed');
 rect(x+7, y-3, 2, 7, '#fff8ed');

 rect(x-4, y-1, 2, 2, '#4a4947');
 rect(x+2, y-1, 2, 2, '#4a4947');

 rect(x, y+1, 1, 1, '#e58f9d');
 rect(x-5, y+2, 2, 2, '#f4b7b5');
 rect(x+3, y+2, 2, 2, '#f4b7b5');

 rect(x-6, y+7, 12, 8, '#8cc8a0');
 rect(x-7, y+8, 2, 5, '#fff8ed');
 rect(x+5, y+8, 2, 5, '#fff8ed');
 rect(x-5, y+7, 10, 2, '#f2c75e');

 rect(x-5, y+15, 3, 3, '#fff8ed');
 rect(x+2, y+15, 3, 3, '#fff8ed');
 rect(x-5, y+18, 4, 2, '#a97858');
 rect(x+1, y+18, 4, 2, '#a97858');

 if(currentCastFever){
  rect(118,24,180,22,'#fff0a8'); rect(121,26,174,18,'#d85c42');
  ctx.fillStyle='#fffbe9'; ctx.font='bold 11px sans-serif'; ctx.textAlign='center';
  ctx.fillText('🔥 フィーバータイム！',208,39); ctx.textAlign='start';
 }
 if(mode!=='idle'){
  const rx=x+3, ry=y+8; rect(rx,ry,2,2,'#9b6c42');
  ctx.strokeStyle='#fff5ce'; ctx.beginPath(); ctx.moveTo(rx+1,ry); ctx.lineTo(floatPos.x,floatPos.y); ctx.stroke();
  if(mode==='bite'){rect(floatPos.x-4,floatPos.y-4,8,8,'#ffe16e'); ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.fillText('!',floatPos.x,floatPos.y+3); ctx.textAlign='start';}
  else rect(floatPos.x-2,floatPos.y-2,3,3,'#fff5ce');
 }
}

const isWater=(x,y)=>(x>42 && x<372 && y>58 && y<170) && !(x>=196 && x<=220);
const nearLake = () => {
 const px = player.x;
 const py = player.y;
 const nearTopEdge = (px >= 36 && px <= 376 && py >= 40 && py <= 58);
 const nearBottomEdge = (px >= 36 && px <= 376 && py >= 162 && py <= 180);
 const nearSideEdge = ((px >= 32 && px <= 48) || (px >= 364 && px <= 380)) && (py >= 40 && py <= 180);
 const nearPier = (px >= 180 && px <= 236 && py >= 50 && py <= 176);
 return nearTopEdge || nearBottomEdge || nearSideEdge || nearPier;
};

function move(dir){
 if(mode!=='idle'){say('釣りの最中だよ！'); return;}
 const ox=player.x, oy=player.y, s=8;
 if(dir==='up') player.y-=s; if(dir==='down') player.y+=s; if(dir==='left') player.x-=s; if(dir==='right') player.x+=s;
 player.x=Math.max(24,Math.min(392,player.x)); player.y=Math.max(40,Math.min(216,player.y));
 if(isWater(player.x,player.y)){player.x=ox; player.y=oy; say('水の中には入れないよ！');}
 else if(nearLake()) say('釣りスポットに着いたよ！「つりをする」を押してね。');
 else say('池のまわりや桟橋で釣りをしよう。');
 persist();
}

document.querySelectorAll('[data-dir]').forEach(btn=>{
 const dir=btn.dataset.dir; let t;
 const start=e=>{e.preventDefault(); move(dir); btn.classList.add('pressed'); t=setInterval(()=>move(dir),130);};
 const stop=()=>{clearInterval(t); btn.classList.remove('pressed');};
 btn.onpointerdown=start; ['pointerup','pointercancel','pointerleave'].forEach(ev=>btn.addEventListener(ev,stop));
});

const getWeights=()=>fishTypes.map(f=>f.base*(f.rarity==='ふつう'?1:1+rodBonus(save.equippedRod))*(currentCastFever?({'ふつう':1,'ちょっとレア':1.8,'レア':2.6,'ウルトラレア':3.4,'伝説':4.2,'神話級':5}[f.rarity]||1):1));

function chooseFish(ex=[]){
 const weights=getWeights(), avail=fishTypes.map((f,i)=>({f,w:weights[i]})).filter(x=>!ex.includes(x.f.id));
 let sum=avail.reduce((a,x)=>a+x.w,0), r=Math.random()*sum;
 for(const item of avail){if(r<item.w) return item.f; r-=item.w;}
 return avail[0]?.f||fishTypes[0];
}

function finishCatch(){
 clearTimeout(biteTimer);
 const currentRod=rods[save.equippedRod];
 const escapeRate=currentRod.escapeRate ?? 0.12;
 if(Math.random() >= escapeRate){
  const fishes=[chooseFish()];
  if(currentCastFever && Math.random()<.5){
   while(fishes.length<(Math.random()<.5?2:3)) fishes.push(chooseFish(fishes.map(f=>f.id)));
  }
  const feverMultiplier = currentCastFever ? 2 : 1;
  const logs=fishes.map((f,i)=>{
   const isNew=!(save.caughtCounts[f.id]);
   // 10%の確率で巨大な魚にする
   const isGiant = Math.random() < 0.10;
   const giantMultiplier = isGiant ? 2 : 1;
   
   if(isGiant){
    save.giantCounts[f.id] = (save.giantCounts[f.id] || 0) + 1;
   }

   const earnedG = f.value * feverMultiplier * giantMultiplier;
   save.inventory.push(f.id); 
   save.caughtCounts[f.id]=(save.caughtCounts[f.id]||0)+1; 
   save.coins+=earnedG;

   const sizeText = isGiant ? '【巨大】' : '';
   const extraText = (currentCastFever && isGiant) ? ' (ボーナス4倍!)' : currentCastFever ? ' (ボーナス2倍!)' : isGiant ? ' (ボーナス2倍!)' : '';

   return `<div class="catch-entry">${isNew?'<span class="new-label">NEW</span>':''}${i===0?'やったー！':''}<strong>${sizeText}${f.name}</strong>を釣った！ <strong>${earnedG} G${extraText}</strong>ゲット！</div>`;
  });
  mode='reel'; say(`${fishes.length>1?'🎉 大漁！':''} ${logs.join('')}`, true);
  persist(); setTimeout(()=>{mode='idle'; updateUI();},1400);
 } else {
  currentCastFever=false; mode='idle'; say('逃げられちゃった…！'); updateUI();
 }
}

function fishing(){
 if(mode==='waiting'){say('アタリを待とう！'); return;}
 if(mode==='bite'){finishCatch(); return;}
 if(mode==='reel') return;
 if(!nearLake()){
  say('池のまわりや桟橋で釣りをしよう。');
  return;
 }

 let attempts=0;
 do{
  floatPos.x=Math.round(player.x+(Math.random()-.5)*80);
  floatPos.y=Math.round(player.y+(Math.random()-.5)*40);
  attempts++;
 } while(!isWater(floatPos.x,floatPos.y) && attempts<100);

 if(!isWater(floatPos.x,floatPos.y)){
  say('池のまわりや桟橋で釣りをしよう。');
  return;
 }

 fishingAttempts++;
 if(feverCastsRemaining===0 && !currentCastFever && fishingAttempts>=nextFeverAt){
  feverCastsRemaining=3; nextFeverAt=fishingAttempts+10+Math.floor(Math.random()*11);
 }
 currentCastFever=feverCastsRemaining>0; if(currentCastFever) feverCastsRemaining--;
 mode='waiting'; say(currentCastFever?'🔥 フィーバー中！レア魚チャンスUP！':'糸をたらしたよ…ぷかぷか。'); updateUI();

 waitTimer=setTimeout(()=>{
  if(mode==='waiting'){
   mode='bite'; say('✨ ウキが動いた！「今だ！合わせる」を押して！'); updateUI();
   biteTimer=setTimeout(()=>{if(mode==='bite'){currentCastFever=false; mode='idle'; say('アタリを逃した…。'); updateUI();}},3000);
  }
 },1400+Math.random()*2800);
}

document.querySelectorAll('[data-action="fish"]').forEach(b=>b.onclick=fishing);
document.querySelectorAll('[data-page],[data-goto]').forEach(b=>b.onclick=()=>{const p=b.dataset.page||b.dataset.goto; document.querySelectorAll('.panel').forEach(el=>el.classList.remove('active')); $(p+'Page').classList.add('active'); document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.page===p));});

window.onkeydown=e=>{
 const dirs={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'};
 if(dirs[e.key]){e.preventDefault(); move(dirs[e.key]);}
 if(e.key===' '||e.key==='Enter'){e.preventDefault(); fishing();}
};

updateUI(); requestAnimationFrame(function loop(){drawScene(); requestAnimationFrame(loop);});
})();
</script>
